# 서버 포트 설정
server:
  port: 8080

spring:
  application:
    name: SBB

  devtools:
    restart:
      enabled: true

  ####################################
  # MySQL 설정
  ####################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sbb_a?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "0000"

  ####################################
  # JPA 설정
  ####################################
  jpa:
    open-in-view: true      # JPA 영속성 컨텍스트를 뷰까지 유지할지 여부
    hibernate:
      ddl-auto: update      # create (새로 만들기), update (유지하고 덮어쓰기), ...
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        # 카멜케이스를 언더스코어로 변환 (자바는 카멜케이스[대소문자 구별] -> SQL은 소문자로[구별 X])

    show-sql: true          # SQL 출력 여부
    properties:
      hibernate:
        format_sql: true    # SQL 포맷팅 여부
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    encoding:
      charset: UTF-8        # 인코딩 설정